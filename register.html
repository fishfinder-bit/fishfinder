<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - FishFinder</title>
    <style>
        :root {
            --bg: #edf8f1;
            --card: rgba(255, 255, 255, 0.96);
            --primary: #138a1f;
            --primary-dark: #0d7118;
            --text: #17311f;
            --muted: #6d7f73;
            --border: #d9e6dd;
            --danger: #b42318;
            --success: #147a2c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(42, 160, 52, 0.12), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(53, 126, 255, 0.08), transparent 30%),
                linear-gradient(135deg, #f7fcf8 0%, var(--bg) 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .auth-shell {
            width: min(100%, 460px);
        }

        .auth-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 28px;
            padding: 38px 34px 32px;
            box-shadow: 0 18px 50px rgba(22, 68, 36, 0.12);
            backdrop-filter: blur(8px);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 14px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #ffffff, #e8f6eb);
            box-shadow: inset 0 0 0 1px #dcebe0;
            font-size: 44px;
        }

        .brand h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        form { margin-top: 10px; }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .field input {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 14px 15px;
            font-size: 16px;
            background: #fff;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        .field input:focus {
            border-color: #55a963;
            box-shadow: 0 0 0 4px rgba(19, 138, 31, 0.10);
            transform: translateY(-1px);
        }

        .primary-btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #23a632);
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(19,138,31,0.22);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(19,138,31,0.26);
            filter: brightness(1.02);
        }

        .primary-btn:active { transform: translateY(0); }

        #message {
            min-height: 24px;
            margin: 16px 2px 4px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .switch {
            margin: 22px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .switch a {
            color: var(--primary-dark);
            font-weight: 800;
            text-decoration: none;
        }

        .switch a:hover { text-decoration: underline; }

        .tip {
            margin-top: 18px;
            padding: 11px 13px;
            border-radius: 12px;
            background: #f4faf5;
            color: #597163;
            text-align: center;
            font-size: 12px;
            border: 1px solid #e0ece3;
        }

        @media (max-width: 520px) {
            .auth-card { padding: 30px 20px 24px; border-radius: 22px; }
            .brand h1 { font-size: 29px; }
            .brand-icon { width: 74px; height: 74px; font-size: 39px; }
        }
    </style>
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">🎣</div>
                <h1>สมัครสมาชิก FishFinder</h1>
                <p>สร้างบัญชีเพื่อบันทึกทริปตกปลาและใช้งาน FishFinder</p>
            </div>

            <form id="registerForm">
                <div class="field">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" required placeholder="example@email.com" autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
                </div>

                <button class="primary-btn" type="submit">✨ สมัครสมาชิก</button>
            </form>

            <p id="message"></p>

            <p class="switch">
                มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a>
            </p>

            <div class="tip">FishFinder · คู่มือปลา · บันทึกการตกปลา · อุปกรณ์</div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        window.supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "กำลังสมัครสมาชิก...";
            message.style.color = "#6d7f73";

            const { data, error } =
                await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent =
                    "สมัครไม่สำเร็จ: " + error.message;
                message.style.color = "#b42318";
                return;
            }

            message.textContent =
                "สมัครสมาชิกสำเร็จ กำลังเข้าสู่หน้า FishFinder...";
            message.style.color = "#147a2c";

            setTimeout(function () {
                window.location.href = "index.html";
            }, 800);
        });
    </script>
</body>

</html>
